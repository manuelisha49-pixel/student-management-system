<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Student Complaint &amp; Equipment Reporting System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body data-page="admin">

  <div class="view-switcher">
    <button id="themeToggleBtn" class="theme-btn" type="button">Dark Mode</button>
  </div>

  <main class="auth-main">

    <!-- Admins sign in on the main login page (index.html) -->
    <section id="adminDashboard" class="hidden">
      <header class="topbar">
        <div class="brand"><span class="brand-logo" role="img" aria-label="School crest"></span><span class="brand-text"><strong>Admin Portal</strong><small>Complaint &amp; Equipment Reporting</small></span></div>
        <nav class="dashboard-menu" aria-label="Admin dashboard menu">
        <button type="button" class="active" data-admin-view="overview" aria-controls="adminOverviewPanel" aria-pressed="true">Overview</button>
        <button type="button" data-admin-view="equipment" aria-controls="adminEquipmentPanel" aria-pressed="false">Equipment</button>
        <button type="button" data-admin-view="submissions" aria-controls="adminSubmissionsPanel" aria-pressed="false">Submissions</button>
        <button type="button" data-admin-view="accounts" aria-controls="adminAccountsPanel" aria-pressed="false">Accounts</button>
      </nav>
        <button id="adminLogoutBtn" class="btn secondary" type="button">Logout</button>
      </header>

      <div class="page-head">
        <span class="head-pill">Admin Dashboard</span>
        <h2>Admin Control Center</h2>
        <p id="adminWhoami" class="admin-whoami"></p>
      </div>

      <section id="adminOverviewPanel" class="admin-view-panel" data-admin-panel="overview">
        <div id="adminSummaryGrid" class="summary-grid admin-summary-grid"></div>
      </section>

      <section id="adminEquipmentPanel" class="admin-view-panel hidden" data-admin-panel="equipment">
        <div id="adminEquipmentSection" class="card">
          <h3>Equipment & Facilities Maintenance</h3>
          <div id="adminEquipmentList" class="records-list"></div>
        </div>
      </section>

      <section id="adminSubmissionsPanel" class="admin-view-panel hidden" data-admin-panel="submissions">
        <div class="card">
          <h3>Search & Filter General Submissions</h3>
          <div class="filter-bar admin-filter-grid">
            <input type="text" id="adminSearchInput" placeholder="Search by title, student name, or ID...">
            <select id="adminTypeFilter">
              <option value="ALL">All Types</option>
              <option value="Complaint">Complaints Only</option>
              <option value="Suggestion">Suggestions Only</option>
            </select>
            <select id="adminStatusFilter">
              <option value="ALL">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="In-Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
            <select id="adminSortOrder">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="priority">Highest priority</option>
            </select>
          </div>
        </div>

        <div id="adminConcernsSection" class="card">
          <h3>All Student Submissions</h3>
          <div id="adminConcernsList" class="records-list"></div>
        </div>
      </section>

      <section id="adminAccountsPanel" class="admin-view-panel hidden" data-admin-panel="accounts">
        <div id="studentAccountsSection" class="card">
          <h3>View Student Accounts</h3>
          <div id="studentAccountsList" class="records-list"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
